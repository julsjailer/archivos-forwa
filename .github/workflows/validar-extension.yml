name: Validar extensión
on:
  push:
    paths:
      - "extension/**"
      - "dev/tests/**"
      - "dev/calibracion/generar_calibracion.py"
      - ".github/workflows/validar-extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/validar-extension.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar manifiesto y rutas
        run: |
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("extension/manifest.json","utf8")); if(m.manifest_version!==3) throw Error("Se esperaba Manifest V3"); const paths=[...(m.background?.service_worker?[m.background.service_worker]:[]),...(m.options_page?[m.options_page]:[]),...(m.content_scripts||[]).flatMap(x=>x.js||[]),...(m.icons?Object.values(m.icons):[]),...(m.action?.default_icon?Object.values(m.action.default_icon):[])]; for(const p of paths){if(!fs.existsSync("extension/"+p)) throw Error("Falta ruta declarada: "+p)} console.log("Manifiesto y rutas OK")'
      - name: Comprobar sintaxis JavaScript
        run: |
          set -e
          for f in extension/background.js extension/src/*.js; do
            node --check "$f"
          done
          node --test dev/tests/convert-pure.test.js
      - name: Comprobar sintaxis Python del generador
        run: python3 -m py_compile dev/calibracion/generar_calibracion.py
